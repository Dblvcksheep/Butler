# One image, several roles. Put secrets in .env (see .env.example). Terminate HTTPS in front of `web`.
x-app: &app
  build: .
  env_file: .env
  environment:
    FALKORDB_HOST: falkordb
    DATABASE_URL: postgresql://butler:butler@postgres:5432/butler
    REDIS_URL: redis://redis:6379/3
    BUTLER_WORKER_MODE: celery
  depends_on: [falkordb, postgres, redis]
  restart: unless-stopped

services:
  falkordb: {image: "falkordb/falkordb:latest", ports: ["127.0.0.1:3000:3000"], volumes: ["falkor:/var/lib/falkordb/data"]}
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: butler, POSTGRES_PASSWORD: butler, POSTGRES_DB: butler}
    volumes: ["pg:/var/lib/postgresql/data"]
  redis: {image: "redis:7"}
  bot:    {<<: *app, command: python -m butler.telegram_bot}
  web:    {<<: *app, command: gunicorn -b 0.0.0.0:8080 -w 2 butler.wsgi:app, ports: ["127.0.0.1:8080:8080"]}
  worker: {<<: *app, command: celery -A butler.celery_app worker -l info}
  beat:   {<<: *app, command: celery -A butler.celery_app beat -l info}
volumes: {falkor: {}, pg: {}}
